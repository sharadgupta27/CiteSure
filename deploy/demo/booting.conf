# While the API is still starting: every page shows a self-refreshing "waking up" page; API calls and the health
# check answer 503. On a free 0.1-CPU host this lasts a few minutes after a deploy or a wake-up from sleep.
location /api/ {
  default_type application/json;
  return 503 '{"detail":"CiteSure is starting. Try again in a minute."}';
}

location = /healthz {
  return 503;
}

location / {
  root /srv/citesure/boot;
  expires epoch;
  try_files /starting.html =503;
}
