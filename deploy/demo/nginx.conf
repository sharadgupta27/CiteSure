# nginx for the single-container demo: runs as a normal user, serves the React build, proxies /api to uvicorn.
# Same rules as frontend/nginx.conf, except the page may be framed by huggingface.co (a Hugging Face Space embeds it).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  types { text/javascript mjs; }   # PDF.js worker; stock mime.types would send application/octet-stream
  default_type application/octet-stream;
  access_log off;
  sendfile on;

  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  server {
    listen 7860;
    server_name _;
    root /srv/citesure/web;
    index index.html;
    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors https://huggingface.co" always;

    # booting.conf (a "starting" page) until the API is ready, then live.conf; start.sh copies one here and reloads.
    include /tmp/citesure-locations.conf;
  }
}
