# Normal operation: proxy /api to uvicorn, serve the React build. start.sh switches to this once the API answers.
location /api/v1/ask/stream {
  proxy_pass http://127.0.0.1:8000;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 300s;
}

location /api/ {
  proxy_pass http://127.0.0.1:8000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location /healthz {
  proxy_pass http://127.0.0.1:8000;
}

# `expires`, not add_header: an add_header inside a location drops every add_header of the server block,
# which would strip the security headers above from these responses.
location /assets/ {
  expires 1y;
  try_files $uri =404;
}

location / {
  expires epoch;
  try_files $uri /index.html;
}
