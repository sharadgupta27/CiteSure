<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="10">
  <title>CiteSure is starting</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif;
           background: #0f172a; color: #e2e8f0; }
    main { max-width: 32rem; padding: 2rem; text-align: center; }
    h1 { font-size: 1.6rem; margin: 0 0 .5rem; color: #fff; }
    .dot { display: inline-block; width: .6rem; height: .6rem; border-radius: 50%; background: #818cf8;
           animation: pulse 1.2s infinite ease-in-out; margin: 0 .2rem; }
    .dot:nth-child(2) { animation-delay: .2s; } .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes pulse { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
    p { color: #94a3b8; }
  </style>
</head>
<body>
  <main>
    <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <h1>CiteSure is waking up</h1>
    <p>This free demo sleeps when nobody is using it. Starting takes two to four minutes; this page reloads by itself.</p>
    <p>Answers you can verify: every sentence cited, every citation checked.</p>
  </main>
</body>
</html>
