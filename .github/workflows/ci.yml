name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: API contract and golden set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }   # the golden-set check compares against origin/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Lint openapi.yaml (Spectral)
        run: npx --yes @stoplight/spectral-cli@6 lint openapi.yaml --fail-severity error
      - name: Golden-set quotes still exist in the corpus
        run: python corpus/validate_golden.py
      - name: Golden set is append-only (nothing weakened or deleted)
        run: python agent-hooks/check_golden_append_only.py --base origin/main || python agent-hooks/check_golden_append_only.py
      - name: Every GitHub Action is pinned to a commit SHA
        run: python security/pin_actions.py --check
      - name: Agent pack copies match the canonical files
        run: python agent-hooks/install.py --check

  backend:
    name: Backend (lint, types, unit, integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - name: Unit tests (fake providers, no Docker)
        run: uv run pytest -m "not integration" -q
      - name: Integration tests (real Postgres + pgvector via testcontainers)
        run: uv run pytest -m integration -q

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - name: Generated client is in sync with openapi.yaml
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  agent-pack:
    name: Agent extension pack (hooks and MCP server tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Hook tests
        run: uv run --no-project --with pytest python -m pytest agent-hooks/tests -q
      - name: MCP server tests
        working-directory: mcp-server
        run: uv run --frozen pytest -q || uv run pytest -q
      - name: Custom agent tests
        working-directory: custom-agent
        run: uv run --no-project --with pytest --with httpx python -m pytest -q

  e2e:
    name: End-to-end (Playwright against Docker Compose)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Start the stack and load the demo company
        run: |
          docker compose up -d --build --wait
          docker compose run --rm api python -m app.seed
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run the happy path, including the restricted-user refusal
        working-directory: e2e
        run: npx playwright test
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: playwright-report, path: e2e/playwright-report }
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - run: docker compose down -v

  security:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: Secrets (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SAST (Semgrep)
        run: docker run --rm -v "$PWD:/src" semgrep/semgrep semgrep scan --config p/python --config p/typescript --config p/react --config p/dockerfile --error --metrics=off /src/backend/app /src/frontend/src /src/mcp-server /src/agent-hooks
      # The official image is run directly instead of a third-party action: one less thing that can be repointed.
      - name: Dependencies, secrets and misconfiguration (Trivy)
        run: >-
          docker run --rm -v "$PWD:/repo" aquasec/trivy:0.57.0 fs --scanners vuln,secret,misconfig
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --skip-dirs node_modules,.venv,dist,uploads,security,corpus/raw /repo
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Python dependencies (pip-audit)
        working-directory: backend
        run: uv export --frozen --no-dev --no-hashes -o /tmp/requirements.txt && uvx pip-audit -r /tmp/requirements.txt --strict
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: JavaScript dependencies (npm audit)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with: { context: ., file: backend/Dockerfile, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with: { context: ., file: frontend/Dockerfile, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Scan the image for vulnerabilities
        run: |
          docker build -f backend/Dockerfile -t citesure-backend:ci .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.0 image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 citesure-backend:ci
