[project]
name = "citesure-backend"
version = "1.0.0"
description = "CiteSure API and worker: grounded document Q&A with verified citations."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "pyjwt>=2.9",
  "bcrypt>=4.2",
  "python-multipart>=0.0.9",
  "python-docx>=1.1",
  "markdown-it-py>=3.0",
  "beautifulsoup4>=4.12",
  "anthropic>=0.40",
  "rapidfuzz>=3.9",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "pymupdf>=1.24,<2",
  "cryptography>=50.0.2",
]

[project.optional-dependencies]
# Local ONNX embeddings + cross-encoder reranker. Heavy (downloads models), so it is optional:
# tests and CI use the deterministic Fake embedder. Install with: uv sync --extra ml
ml = ["fastembed>=0.4"]
s3 = ["boto3>=1.35"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "testcontainers[postgres]>=4.8",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs Docker (Postgres + pgvector via testcontainers)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 125
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101", "B008", "RUF012", "ASYNC240", "S106", "RUF007"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S608", "E501", "ASYNC230", "S101", "SIM117", "RUF001", "RUF003", "RUF059", "RUF015"]
"app/rag/retrieval/*.py" = ["S608"]
"app/repositories/*.py" = ["S608"]
"app/rag/verification/quote_match.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["app.rag.parsing.pdf"]
disallow_untyped_calls = false  # PyMuPDF ships no type information

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
