# Trivy secret-scanner exceptions for the image scan (docker-images job in .github/workflows/ci.yml).
#
# The `gcp-service-account` rule matches prose in the docstrings of the vendored Anthropic SDK
# (beta/agents/agents.py: "sending `{...}` stores the default"). There is no credential in it; it is
# documentation for an `execution_identity` parameter. The exception is limited to that one package
# inside the image's virtualenv, so a real key anywhere else in the image, or in the repo (gitleaks and
# the filesystem scan still cover it), still fails the build.
allow-rules:
  - id: anthropic-sdk-docstrings
    description: Docstring text in the Anthropic SDK that looks like a GCP service-account key to the scanner
    path: ^srv/citesure/backend/\.venv/lib/python3\.\d+/site-packages/anthropic/
