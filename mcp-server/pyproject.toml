[project]
name = "citesure-mcp-server"
version = "1.0.0"
description = "MCP server that lets a coding agent inspect CiteSure with the SAME access rules as a human user."
requires-python = ">=3.12"
dependencies = ["mcp>=1.2", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
