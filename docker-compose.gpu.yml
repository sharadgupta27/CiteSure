# Optional overlay: give the local model an NVIDIA GPU.
#   docker compose -f docker-compose.private.yml -f docker-compose.gpu.yml up -d
# Needs the NVIDIA Container Toolkit (Linux) or Docker Desktop with the WSL2 GPU backend (Windows).
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
