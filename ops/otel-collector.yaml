# Receives OTLP traces from the API and the worker (OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318) and forwards them to Tempo.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}
  # Spans carry ids and sizes only (never question or chunk text). This is a second line of defence.
  attributes/redact:
    actions:
      - { key: question, action: delete }
      - { key: chunk.text, action: delete }

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: { insecure: true }

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/redact, batch]
      exporters: [otlp/tempo]
