server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Docker's DNS, asked again every few seconds: a recreated api container gets a new IP, and a name that nginx
  # resolved only once at start-up would keep pointing at the old one (502 on every API call).
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api http://api:8000;

  # The PDF viewer's worker is an ES module (.mjs). nginx's stock mime.types has no entry for it and would serve it as
  # application/octet-stream, which browsers refuse to run as a module: the viewer then says "could not be displayed".
  include /etc/nginx/mime.types;
  types {
    text/javascript mjs;
  }

  client_max_body_size 25m;   # a little above MAX_UPLOAD_MB; the API enforces the real limit

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

  # Server-Sent Events must not be buffered, or the stage events arrive all at once at the end.
  location /api/v1/ask/stream {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /healthz {
    proxy_pass $api;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Single-page app: unknown paths serve index.html and the router takes over.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
